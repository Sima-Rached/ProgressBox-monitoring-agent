[influxdb]
url = "http://influxdb:8086"
org = "monitoring-org"
bucket = "broker-metrics"
# token intentionally not here — comes from INFLUXDB_TOKEN env var,
# same value docker-compose.yml uses to init InfluxDB. See .env.


[intervals]
mqtt_scrape_secs = 2
docker_scrape_secs = 10
influx_write_secs = 5

[[brokers]]
id = "broker-1"
mqtt_host = "mosquitto"
mqtt_port = 1883
container_name = "mosquitto"

[[brokers]]
id = "broker-2"
mqtt_host = "mosquitto2"
mqtt_port = 1883
container_name = "mosquitto2"

[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
from = "your-source@domaine.com"
to = ["your-destination@domaine.com"]