[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }

tokio.workspace        = true
axum.workspace         = true
serde.workspace        = true
serde_json.workspace   = true
chrono.workspace       = true
influxdb2.workspace    = true

rumqttc            = "0.24"
bollard            = "0.17"
toml               = "0.8"
lettre             = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
futures-util       = "0.3"
dashmap            = "6"
influxdb2-derive   = "0.1"
influxdb2-structmap = "0.2.0"
futures            = "0.3"
hostname           = "0.3"
num-traits         = "0.2"
tower              = "0.5.3"
dotenvy            = "0.15"
# tower_governor removed — rate limiting is now the gateway's responsibility
