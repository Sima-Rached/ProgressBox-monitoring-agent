name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"        # e.g. v1.2.0 -> builds + pushes :1.2.0 and :latest
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent, gateway]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage config files at repo root
        # Dockerfiles do `COPY config.toml ./config/config.toml` and
        # `COPY rules.toml ./config/rules.toml`, expecting both at the
        # build context root — but they live under config/ in the repo.
        # Locally this is handled by the "cp config/*.toml ./" step in
        # the Quick Start; CI needs the same copy before building.
        run: |
          cp config/config.toml ./config.toml
          cp config/rules.toml ./rules.toml
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version tag
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .                                 # repo root — required for the `common` path dependency
          file: ${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/progressbox-${{ matrix.service }}:${{ steps.ver.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/progressbox-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max