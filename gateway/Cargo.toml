[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio.workspace      = true
axum.workspace        = true
serde.workspace       = true
serde_json.workspace  = true

# Auth + rate limiting live here now — moved out of the agent (Step 2).
tower_governor = "0.7"
governor       = "0.8"
tower          = "0.5"

# Reverse-proxy client used to forward /api/v1/* to the internal agent.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

dotenvy = "0.15"
common = { path = "../common" }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }